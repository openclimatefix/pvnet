name: Branch CI (Python)
run-name: 'Test branch commit "${{ github.event.head_commit.message }}"'

on:  
  push:
    branches-ignore: [ "main" ]
    paths-ignore: ['README.md']

jobs:
  branch-ci:
    uses: openclimatefix/.github/.github/workflows/branch_ci.yml@v1.9.0
    secrets: inherit
    with:
      enable_linting: true
      enable_typechecking: false
      containerfile: 'None'
      tests_folder: 'tests'
      test_python_versions: '["3.11", "3.12"]'
